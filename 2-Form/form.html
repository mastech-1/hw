<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Форма</title>
</head>

<body>
    <main>
        <form action="form">
            <h1>Регистрация</h1>
            <p>Уже есть аккаунт? <a href="#" target="_blank">Войти</a></p>
            <div>
                <label for="comp">
                    <input type="text" id="comp" placeholder="Моя компания" class="comp1">
                </label>
            </div>
            <div>
                <label for="name">
                    <input type="text" id="name" placeholder="Имя" class="name1">
                </label>
                <label for="fam">
                    <input type="text" id="fam" placeholder="Фамилия" class="fam1">
                </label>
            </div>
            <div>
                <label for="email">
                    <input type="email" id="email" placeholder="E-mail" class="email1">
                </label>
            </div>
            <button>Зарегистрироваться</button>
            <div>
                <label for="agr">
                    <div class="agr1">
                        <input type="checkbox" id="agr" name="agr">
                        Я прочитал и принимаю
                        <a href="#" target="_blank">Условия использования</a>
                    </div>
                </label>
            </div>
        </form>
    </main>
</body>

</html>
